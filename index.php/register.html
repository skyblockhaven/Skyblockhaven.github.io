<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | SkyBlockHaven</title>

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

<div class="logo">
⛏️ SkyBlockHaven
</div>


<div class="auth-card">

<h1>📝 Register</h1>

<p>Create your SkyBlockHaven account</p>


<form id="registerForm">

<input
type="text"
placeholder="Username"
required>


<input
type="email"
placeholder="Email"
required>


<input
type="password"
placeholder="Password"
required>


<input
type="password"
placeholder="Confirm Password"
required>


<button type="submit">
Create Account
</button>


</form>


<div class="links">

<a href="login.html">
Already have an account?
</a>


<a href="index.html">
Back Home
</a>


</div>


</div>

</div>
